<text x="765.0" y="542" font-size="15" fill="#4a5568" text-anchor="middle">= at most 3 engines in production</text>
<circle cx="44" cy="585" r="14" fill="#2d3748"/><text x="44" y="591" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="70" y="591" font-size="17" fill="#2d3748">The customer orders a car: a kanban card goes to final assembly.</text>
<circle cx="44" cy="617" r="14" fill="#2d3748"/><text x="44" y="623" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<text x="70" y="623" font-size="17" fill="#2d3748">Final assembly sends a card to each component workstation whose component it needs.</text>
<circle cx="44" cy="649" r="14" fill="#2d3748"/><text x="44" y="655" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="70" y="655" font-size="17" fill="#2d3748">Component workstations order the parts they need in the same way.</text>
<circle cx="44" cy="681" r="14" fill="#2d3748"/><text x="44" y="687" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
<text x="70" y="687" font-size="17" fill="#2d3748">Finished items move back towards the customer with their cards. Once used, the card is returned for the next order.</text>
<line x1="30" y1="470" x2="74" y2="470" stroke="#dd6b20" stroke-width="3" stroke-dasharray="8,5"/><text x="84" y="476" font-size="16" fill="#4a5568">kanban card (pull signal)</text>
<line x1="30" y1="502" x2="74" y2="502" stroke="#2d3748" stroke-width="3"/><text x="84" y="508" font-size="16" fill="#4a5568">product or component</text>
