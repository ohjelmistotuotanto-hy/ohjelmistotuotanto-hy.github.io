<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="940" height="460" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="940" height="460" fill="#ffffff"/>

  <defs>
    <marker id="n-tumma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
    </marker>
    <marker id="n-vihr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- kerrokset -->
  <g fill="#f4f6f9" stroke="#c9d3e0" stroke-width="1">
    <rect x="20" y="110" width="580" height="100" rx="6"/>
    <rect x="20" y="225" width="580" height="90" rx="6"/>
    <rect x="20" y="330" width="580" height="115" rx="6"/>
  </g>
  <g font-size="12" fill="#55657a" font-weight="bold">
    <text x="32" y="130">käyttöliittymä</text>
    <text x="32" y="245">sovelluslogiikka</text>
    <text x="32" y="350">tietojen tallennus</text>
  </g>

  <!-- selain -->
  <rect x="300" y="30" width="200" height="44" rx="6" fill="#eeeeee" stroke="#777" stroke-width="2"/>
  <text x="400" y="57" text-anchor="middle" font-weight="bold" fill="#333">Selain</text>

  <!-- templates ja app.py -->
  <rect x="120" y="140" width="180" height="52" rx="6" fill="#ffffff" stroke="#1f5fa8" stroke-width="2"/>
  <text x="210" y="162" text-anchor="middle" font-weight="bold" fill="#1f5fa8">templates/</text>
  <text x="210" y="180" text-anchor="middle" font-size="12" fill="#444">HTML-sivupohjat (Jinja)</text>

  <rect x="340" y="140" width="180" height="52" rx="6" fill="#ffffff" stroke="#1f5fa8" stroke-width="2"/>
  <text x="430" y="162" text-anchor="middle" font-weight="bold" fill="#1f5fa8">app.py</text>
  <text x="430" y="180" text-anchor="middle" font-size="12" fill="#444">reitit, esim. POST /login</text>

  <!-- UserService -->
  <rect x="200" y="250" width="260" height="52" rx="6" fill="#ffffff" stroke="#1f5fa8" stroke-width="2"/>
  <text x="330" y="272" text-anchor="middle" font-weight="bold" fill="#1f5fa8">UserService</text>
  <text x="330" y="290" text-anchor="middle" font-size="12" fill="#444">check_credentials, create_user</text>

  <!-- UserRepository -->
  <rect x="200" y="358" width="260" height="52" rx="6" fill="#ffffff" stroke="#1f5fa8" stroke-width="2"/>
  <text x="330" y="380" text-anchor="middle" font-weight="bold" fill="#1f5fa8">UserRepository</text>
  <text x="330" y="398" text-anchor="middle" font-size="12" fill="#444">find_by_username, create, delete_all</text>
  <text x="330" y="430" text-anchor="middle" font-size="12" fill="#666" font-style="italic">käyttäjät tallessa keskusmuistissa listana</text>

  <!-- User -->
  <rect x="650" y="300" width="150" height="52" rx="6" fill="#fdf1e4" stroke="#d9822b" stroke-width="2"/>
  <text x="725" y="322" text-anchor="middle" font-weight="bold" fill="#b8651a">User</text>
  <text x="725" y="340" text-anchor="middle" font-size="12" fill="#444">username, password</text>
  <text x="725" y="292" text-anchor="middle" font-size="11" fill="#666">entities/</text>

  <!-- sovelluksen nuolet -->
  <g fill="none" stroke="#333" stroke-width="2">
    <line x1="420" y1="76" x2="430" y2="136" marker-start="url(#n-tumma)" marker-end="url(#n-tumma)"/>
    <line x1="338" y1="166" x2="304" y2="166" marker-end="url(#n-tumma)"/>
    <line x1="410" y1="194" x2="360" y2="246" marker-end="url(#n-tumma)"/>
    <line x1="330" y1="304" x2="330" y2="354" marker-end="url(#n-tumma)"/>
  </g>
  <g fill="none" stroke="#d9822b" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="462" y1="282" x2="648" y2="318"/>
    <line x1="462" y1="380" x2="648" y2="336"/>
  </g>
  <g font-size="12" fill="#333">
    <text x="434" y="110">HTTP-pyyntö / HTML-sivu</text>
    <text x="321" y="132" text-anchor="middle" font-size="11">render_template</text>
    <text x="398" y="230">kutsuu</text>
    <text x="338" y="336">kutsuu</text>
    <text x="725" y="370" text-anchor="middle" fill="#b8651a" font-size="11">UserService ja UserRepository</text>
    <text x="725" y="384" text-anchor="middle" fill="#b8651a" font-size="11">käsittelevät User-olioita</text>
  </g>

  <!-- testit -->
  <rect x="640" y="20" width="280" height="190" rx="8" fill="#f3f9f3" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="780" y="42" text-anchor="middle" font-weight="bold" fill="#2e7d32">Robot-testit (src/tests)</text>

  <rect x="660" y="56" width="240" height="44" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="780" y="76" text-anchor="middle" font-weight="bold" fill="#2e7d32">Browser-kirjasto</text>
  <text x="780" y="92" text-anchor="middle" font-size="12" fill="#444">Click, Fill Text, Get Title …</text>

  <rect x="660" y="140" width="240" height="52" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="780" y="162" text-anchor="middle" font-weight="bold" fill="#2e7d32">AppLibrary.py</text>
  <text x="780" y="180" text-anchor="middle" font-size="12" fill="#444">Reset Application, Create User</text>

  <g fill="none" stroke="#2e7d32" stroke-width="2">
    <line x1="658" y1="66" x2="504" y2="52" marker-end="url(#n-vihr)"/>
    <line x1="658" y1="166" x2="524" y2="166" marker-end="url(#n-vihr)"/>
  </g>
  <g font-size="11" fill="#2e7d32">
    <text x="580" y="50" text-anchor="middle">ohjaa selainta</text>
    <text x="582" y="158" text-anchor="middle">HTTP:</text>
    <text x="582" y="184" text-anchor="middle">/tests/reset</text>
    <text x="582" y="198" text-anchor="middle">/register</text>
  </g>
</svg>
