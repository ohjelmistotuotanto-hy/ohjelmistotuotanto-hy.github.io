<text x="500.0" y="418" font-size="19" font-weight="normal">long-term thinking</text>
<text x="500.0" y="453" font-size="19" font-weight="normal">flow, pull</text>
<text x="500.0" y="488" font-size="19" font-weight="normal">less variability</text>
<text x="500.0" y="511" font-size="19" font-weight="normal">and overburden</text>
