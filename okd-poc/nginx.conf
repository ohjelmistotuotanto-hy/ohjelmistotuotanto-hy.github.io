server {
    listen 8080;
    root /usr/share/nginx/html;

    # Links like /osa1 and /tehtavat1 are served directly without redirects,
    # since a redirect from nginx would not know about the /ohtu prefix
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
