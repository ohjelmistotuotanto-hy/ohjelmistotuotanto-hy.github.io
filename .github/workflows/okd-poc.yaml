name: Build and push kertaaja POC image

on:
  push:
    branches: [master]
    paths:
      - okd-poc/**
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: okd-poc
          push: true
          tags: ghcr.io/ohjelmistotuotanto-hy/kertaaja-poc:latest
